<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV & Portfolio Profesional Saya</title>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. VARIABEL WARNA & RESET STYLES
           ========================================== */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5; /* Indigo */
            --card-bg: #f3f4f6;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --border-color: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a; /* Slate 900 */
            --text-color: #f8fafc;
            --primary-color: #818cf8; /* Light Indigo */
            --card-bg: #1e293b; /* Slate 800 */
            --nav-bg: rgba(15, 23, 42, 0.85);
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* ==========================================
           2. NAVIGASI BAR
           ========================================== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav .logo span { 
            color: var(--primary-color); 
        }

        nav ul { 
            display: flex; 
            list-style: none; 
        }

        nav ul li a {
            margin-left: 30px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul li a:hover { 
            color: var(--primary-color); 
        }

        /* ==========================================
           3. FLOATING DARK MODE BUTTON
           ========================================== */
        .theme-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1001;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background-color 0.3s;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        /* ==========================================
           4. HERO & BINGKAI FOTO SECTION
           ========================================== */
        .section {
            padding: 120px 8% 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #hero {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-content h5 {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .hero-content h1 {
            font-size: 48px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-content p {
            margin-bottom: 35px;
            line-height: 1.7;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .btn:hover { 
            opacity: 0.95; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
        }

        /* Galeri Bingkai Foto di Hero */
        .photo-gallery {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Gaya Bingkai 1: Modern */
        .frame-modern {
            position: relative;
            width: 160px;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .frame-modern img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .frame-modern:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3);
        }

        /* Gaya Bingkai 2: Polaroid */
        .frame-polaroid {
            background: #ffffff;
            padding: 10px 10px 18px 10px;
            width: 160px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transform: rotate(-3deg);
            transition: transform 0.3s;
        }
        [data-theme="dark"] .frame-polaroid {
            background: #ffffff;
            color: #333333; 
        }
        .frame-polaroid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .frame-polaroid .caption {
            text-align: center;
            font-weight: 600;
            margin-top: 8px;
            font-size: 13px;
        }
        .frame-polaroid:hover {
            transform: rotate(0deg) scale(1.05);
        }

        /* Gaya Bingkai 3: Lingkaran */
        .frame-circle {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .frame-circle img {
            width: 136px;
            height: 136px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 4px solid var(--bg-color);
        }
        .frame-circle .ring {
            position: absolute;
            width: 152px;
            height: 152px;
            border-radius: 50%;
            border: 2px dashed var(--primary-color);
            animation: spin 20s linear infinite;
            z-index: 1;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ==========================================
           5. SECTION GENERAL COMPONENTS
           ========================================== */
        .title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            font-weight: 700;
        }

        .title::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 4px;
            background-color: var(--primary-color);
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        /* Grid Keahlian */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .skill-card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-color);
        }

        .skill-card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .skill-card h3 { 
            margin-bottom: 15px; 
            color: var(--primary-color); 
            font-size: 20px;
        }

        .skill-card p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.8;
        }

        /* Timeline Pengalaman */
        .timeline {
            border-left: 3px solid var(--primary-color);
            padding-left: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 50px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: var(--primary-color);
            left: -39px;
            top: 5px;
            border-radius: 50%;
            border: 3px solid var(--bg-color);
        }

        .timeline-item .date {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 14px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .timeline-item h4 {
            font-size: 18px;
            margin-bottom: 10px;
        }
